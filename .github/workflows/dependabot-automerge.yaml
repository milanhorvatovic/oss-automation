name: Dependabot Automerge

# Caller of this repository's own Dependabot policy — consumer #1 of the
# contract documented in dependabot-policy.yaml's header. The `edited`
# trigger type is load-bearing there: a base retarget emits only `edited`.

# pull_request_target, not pull_request, and the difference is the whole
# trust model. This workflow hands the App credentials to a reusable
# workflow, and on pull_request the file naming that workflow is read from
# the merge ref — so the pull request would choose the code the credentials
# reach, whether by editing a locally referenced callee or by moving the SHA
# a pinned one names. pull_request_target reads this file from the default
# branch, so the delegation, the guards below and the privileged list are
# the ones a maintainer merged, and a bump is judged by code it did not
# supply.
#
# The default branch, specifically, and not the branch the pull request
# targets: since 8 December 2025 GitHub resolves a pull_request_target
# workflow's source, GITHUB_REF and GITHUB_SHA from the default branch
# whatever the base is, so that a stale workflow on some other branch
# cannot be selected by choosing it as a base. A pull request targeting
# anything else would therefore be judged by a caller and a privileged
# list its own base does not carry, which is why the guard below refuses
# to delegate for one at all.
#
# The usual objection to pull_request_target is that it pairs credentials
# with a checkout of pull-request code, which is how it earns its
# reputation. Nothing here checks out, and the callee is checkout-free by
# design, so no pull-request code executes in a credentialed job. That is
# the property that makes this trigger correct here rather than merely
# convenient, and it is worth re-reading before any step in this file or its
# callee gains a checkout.
#
# Dependabot's pull_request events are treated as fork events — read-only
# token, Dependabot secrets only — while pull_request_target is not on that
# list and reads the Actions store like any other run. The exception is a
# pull request whose base ref is itself a Dependabot branch, which degrades
# to no secrets; the callee already fails loudly on absent credentials
# rather than proceeding without them.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  caller:
    # Trust guards per the policy contract: keyed on the PR author, never
    # github.actor (the reconciler's branch updates emit synchronize events
    # whose actor is the App), plus the same-repo head pin. They carry more
    # weight on this trigger than they did on pull_request: every pull
    # request now reaches a workflow holding credentials, and these
    # conjuncts are what keep the delegation to Dependabot's own same-repo
    # branches.
    #
    # The third conjunct holds the delegation to pull requests targeting
    # the default branch, because that is the only base for which what
    # runs and what the pull request is measured against are the same
    # tree. A Dependabot `target-branch` pull request would be judged by
    # the default branch's caller, list and policy while its own base
    # carries others, and every downstream parity check — the sweep's
    # trust archaeology, its re-drive — compares against that base. Left
    # for a maintainer rather than decided by a configuration nobody
    # reading the pull request would think to look at.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch
    # Local rather than pinned, and on this trigger that is a preference
    # rather than a risk: the reference resolves against the default
    # branch, so it names the policy this repository merged. Pinning at a release
    # remains open as dogfooding — the fleet home consuming itself the way
    # its consumers do — and the reconciler's re-drive verifies either form.
    uses: ./.github/workflows/dependabot-policy.yaml
    with:
      # A compromised bump of any of these touches the fleet's trust root,
      # so their updates are armed but held for a maintainer — a malicious
      # tag must never ride its own policy to an auto-merged pin bump. What
      # puts an entry here is what its revision can reach, not the file it
      # sits in: the scope it executes under, or the bytes a release publishes
      # and attests — a poisoned build backend ships a poisoned wheel with a
      # valid attestation over it, which is worse than no attestation. The
      # second half is why build, cyclonedx-bom and the two artifact actions
      # are listed even though the build job holds no credentials. The two
      # workflow paths carry the policy these
      # callers delegate to; create-github-app-token and fetch-metadata run
      # in jobs holding the App credentials; checkout runs in release-tag's
      # publishing job and release-please-action in release-please's, both
      # contents: write. Consumers call those two release workflows at a
      # SHA and execute these pins under their own write tokens, so a bump
      # merged here runs everywhere. scorecard-action, codeql-action and
      # attest-build-provenance run only here rather than in a consumer's
      # tree, but under id-token, security-events and attestations write,
      # which is the same test — and the last of those signs the statement a
      # consumer verifies a release asset against, so an unreviewed revision
      # of it is a revision of this repository's provenance claim.
      # setup-python is deliberately absent — every job it runs in is
      # contents: read with no secret in scope, which is why release.yaml's
      # artifacts job builds on the runner's own interpreter rather than
      # quietly falsifying that. Holding checkout also holds it for those
      # read-only jobs, since Dependabot names the dependency, not the job.
      #
      # That hold is real on this trigger: the policy weighing the list is
      # the default branch's, not the one the bump carries. The fleet home
      # is named by the two workflow paths rather than by the repository,
      # because Dependabot names a reusable workflow dependency by its
      # repository-qualified path and the policy matches names exactly.
      privileged-dependencies: |
        milanhorvatovic/oss-automation/.github/workflows/dependabot-policy.yaml
        milanhorvatovic/oss-automation/.github/workflows/dependabot-reconciler.yaml
        actions/create-github-app-token
        dependabot/fetch-metadata
        actions/checkout
        googleapis/release-please-action
        ossf/scorecard-action
        github/codeql-action
        actions/attest-build-provenance
        actions/download-artifact
        actions/upload-artifact
        build
        cyclonedx-bom
        hatchling
      automation-client-id: ${{ vars.AUTOMATION_CLIENT_ID }}
    secrets:
      automation-private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

  gate:
    # The consumer contract's always-run gate: the trust-guarded caller job
    # skips on non-Dependabot PRs and a skipped job reports as passing, so
    # this context — not the callee's — is the one the ruleset requires.
    needs: caller
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on a failed or cancelled policy run
        env:
          RESULT: ${{ needs.caller.result }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" == "failure" || "$RESULT" == "cancelled" ]]; then
            echo "::error::The Dependabot policy run concluded ${RESULT}."
            exit 1
          fi
          echo "Policy result: ${RESULT}."
