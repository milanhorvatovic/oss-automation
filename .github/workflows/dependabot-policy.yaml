name: Dependabot Policy

# Reusable tier engine for Dependabot PRs. Callers run on
# pull_request [opened, reopened, synchronize, labeled, unlabeled], carry the
# trust guards (Dependabot authorship, same-repo head) as top-level `if:`
# conjuncts, and delegate here at a full commit SHA — this workflow never
# re-checks authorship.
#
#   eligible (patch/minor, not privileged, no veto label) -> approve + arm
#   held     (effective update-type semver-major, or a privileged
#            dependency) -> arm only; the branch ruleset holds the merge
#            until a maintainer's approval lands
#   veto     (trust-boundary or security-review-required label) -> untouched;
#            a label arriving later reactively disarms an already-armed PR
#
# Approval fails open — a failed approve warns and leaves the PR armed for
# manual review. Disarming fails closed — an unconfirmed disarm is a hard
# error. Arm-and-exit by design: no synchronous check-watching merge; the
# reconciler workflow re-drives dropped auto-merge fires on its cron.
#
# Fleet-fixed conventions, deliberately not inputs: the
# DEPENDABOT_AUTOMERGE_ENABLED kill-switch variable, the trust-boundary and
# security-review-required veto labels, squash as the merge method.
# `vars.*` and `github.event` resolve against the calling repository; every
# condition below relies on that.
#
# Checkout-free on purpose: PR code never executes here, so the App secrets
# the caller maps are safe on Dependabot's pull_request events.

on:
  workflow_call:
    inputs:
      privileged-dependencies:
        description: >-
          Newline-separated dependency names the approve step must never
          auto-approve. Matching is exact and case-insensitive; matched PRs
          are still armed, so a maintainer's approval completes the merge.
        required: true
        type: string
    secrets:
      automation-client-id:
        description: Client ID of the GitHub App that approves and arms.
        required: true
      automation-private-key:
        description: Private key of the same GitHub App.
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    # Label events belong to disarm-on-veto; every other action re-derives
    # the tier from fresh state (an unlabeled event may lift a veto).
    # The veto check must sit here, not only on the steps: a vetoed PR's
    # synchronize/reopened/unrelated-unlabeled run would otherwise enter the
    # shared concurrency group, cancel an in-flight disarm-on-veto job, and
    # then skip every mutating step — leaving auto-merge armed despite the
    # hard stop. Skipped at job level, it never enters the group. Removing
    # the last veto label still re-runs policy: that unlabeled payload no
    # longer carries the label.
    if: >-
      github.event.action != 'labeled' && !contains(github.event.pull_request.labels.*.name, 'trust-boundary') && !contains(github.event.pull_request.labels.*.name, 'security-review-required')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize per PR; a newer run supersedes the in-flight one. Non-veto
    # label events never enter the group (this job's `if:` skips them), so
    # Dependabot's rapid post-open labeling cannot cancel the opening run.
    concurrency:
      group: dependabot-policy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # Step `if:` conditions cannot read the secrets context; surface the
      # presence of the App credential here (a boolean, never the value).
      AUTOMATION_SECRET_PRESENT: ${{ secrets.automation-client-id != '' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Pick the most-severe update-type across the (possibly grouped) bump,
      # failing closed on anything unclassifiable: an empty group or any
      # member with a missing/unrecognized updateType forces semver-major,
      # which the approve gate excludes — such a bump is armed but never
      # auto-approved. The member check runs before the severity ranking on
      # purpose: a grouped [patch, unknown] must not classify as patch on
      # the strength of its recognized member alone.
      - name: Derive effective update-type
        id: effective
        env:
          UPDATED_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          effective=$(jq -r '
            [.[] | .updateType]
            | if length == 0 then "version-update:semver-major"
              elif any(IN("version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch") | not) then "version-update:semver-major"
              elif any(. == "version-update:semver-major") then "version-update:semver-major"
              elif any(. == "version-update:semver-minor") then "version-update:semver-minor"
              else "version-update:semver-patch"
              end
          ' <<<"$UPDATED_JSON")
          echo "update-type=$effective" >> "$GITHUB_OUTPUT"

      # Exact, case-insensitive name matching — a substring contains() would
      # let a listed "actions/cache" shadow an unrelated "actions/cache-save".
      - name: Match updated dependencies against the privileged list
        id: privileged
        env:
          UPDATED_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PRIVILEGED_LIST: ${{ inputs.privileged-dependencies }}
        run: |
          set -euo pipefail
          hits=$(jq -r --arg list "$PRIVILEGED_LIST" '
            ($list | ascii_downcase | split("\n")
              | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $priv
            | [.[] | .dependencyName | ascii_downcase | select(. as $name | $priv | index($name))]
            | unique | join(", ")
          ' <<<"$UPDATED_JSON")
          if [[ -n "$hits" ]]; then
            echo "Privileged dependencies in this bump: ${hits}. Arming without approval."
            echo "privileged-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "privileged-hit=false" >> "$GITHUB_OUTPUT"
          fi

      # A skipped step is invisible; logging the resolved state distinguishes
      # "deliberately disabled" from "the variable not resolving in the
      # caller's Dependabot context".
      - name: Report auto-merge switch state
        env:
          ENABLED: ${{ vars.DEPENDABOT_AUTOMERGE_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${ENABLED:-}" == "true" ]]; then
            echo "DEPENDABOT_AUTOMERGE_ENABLED=true; Dependabot autonomy is active."
          else
            echo "::notice::DEPENDABOT_AUTOMERGE_ENABLED is '${ENABLED:-<unset>}' (not 'true'); the approve and arm steps are skipped. Set the calling repository's variable to 'true' to enable."
          fi

      # Short-lived App token for the approve, arm, and held-tier cleanup
      # calls. Minted when automation is enabled, and also — kill switch
      # notwithstanding — when the derived tier is held: revoking a stale
      # approval is a safety transition, not new automation, the same reason
      # the veto disarm mints unconditionally. The empty-secret guard keeps
      # a dormant repository from failing red on every major bump: absent
      # credentials mean the App never approved anything, so there is
      # nothing to clean up. Event-time veto state is already handled by the
      # job's `if:`; the steps below re-check the live label state.
      - name: Mint the automation-bot token
        id: bot-token
        if: >-
          env.AUTOMATION_SECRET_PRESENT == 'true' && (vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true' || steps.effective.outputs.update-type == 'version-update:semver-major' || steps.privileged.outputs.privileged-hit == 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.automation-client-id }}
          private-key: ${{ secrets.automation-private-key }}

      # A PR approved as eligible on an earlier run can be reclassified as
      # held — new commits reshaping the group, or a privileged list grown
      # with no new PR commit at all, which even a consumer's stale-review
      # dismissal cannot catch. Skipping the approve step revokes nothing,
      # and the arm step keeps auto-merge armed, so the stale approval would
      # merge a held update unattended. Dismiss the App's own active
      # approvals whenever the derived tier is held; an unconfirmed
      # dismissal is a hard error, same stance as the veto disarm. Runs
      # regardless of the kill switch — revoking automation the switch can
      # no longer vouch for is exactly what a kill switch is for.
      - name: Dismiss stale approval on held tier
        if: >-
          (steps.effective.outputs.update-type == 'version-update:semver-major' || steps.privileged.outputs.privileged-hit == 'true') && env.AUTOMATION_SECRET_PRESENT == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BOT_LOGIN: ${{ steps.bot-token.outputs.app-slug }}[bot]
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          list_active_approvals() {
            gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate \
              --jq ".[] | select(.user.login == \"${BOT_LOGIN}\" and .state == \"APPROVED\") | .id"
          }
          list_active_approvals | while read -r review_id; do
            echo "Dismissing stale approval ${review_id} by ${BOT_LOGIN}."
            gh api -X PUT "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${review_id}/dismissals" \
              -f message="Dismissed by the Dependabot policy workflow: this update is now held (major or privileged) and requires a maintainer's approval."
          done
          remaining=$(list_active_approvals | wc -l | tr -d ' ')
          if [[ "$remaining" != "0" ]]; then
            echo "::error::A stale approval by ${BOT_LOGIN} is still active on a held update; the PR could merge without a maintainer's approval. Investigate immediately."
            exit 1
          fi

      # Fail-open on purpose: any failure warns and exits 0, leaving the PR
      # armed-but-unapproved so the merge waits for a maintainer instead.
      # errexit stays off; every external call is guarded with `if !` —
      # preserve that pattern when extending.
      - name: Approve eligible update
        if: >-
          steps.effective.outputs.update-type != 'version-update:semver-major' && steps.privileged.outputs.privileged-hit == 'false' && vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set +e
          set -uo pipefail
          if ! has_veto=$(gh pr view "$PR_URL" --json labels --jq 'any(.labels[]; .name == "trust-boundary" or .name == "security-review-required")'); then
            echo "::warning::Failed to query the veto-label state; skipping approval. The PR stays armed for a manual approval."
            exit 0
          fi
          if [[ "$has_veto" == "true" ]]; then
            echo "A veto label was added after the workflow started; skipping approval."
            exit 0
          fi
          if ! gh pr review --approve --body "Auto-approved by the Dependabot policy workflow (patch/minor update, not privileged, no veto label)." "$PR_URL"; then
            echo "::warning::Failed to post the approval review; the PR stays armed for a manual approval."
            exit 0
          fi

      # Held PRs reach this step too — armed but never approved; the calling
      # repository's ruleset holds the merge until the required review lands.
      - name: Arm squash auto-merge
        if: vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          has_veto=$(gh pr view "$PR_URL" --json labels --jq 'any(.labels[]; .name == "trust-boundary" or .name == "security-review-required")')
          if [[ "$has_veto" == "true" ]]; then
            echo "A veto label was added after the workflow started; refusing to arm auto-merge."
            exit 0
          fi

          # `gh pr merge --auto` exits non-zero for benign reasons (already
          # armed, already merged); the verification loop below is the
          # authoritative check, not this call's exit code.
          gh pr merge --auto --squash "$PR_URL" 2>&1 || true
          for attempt in {1..6}; do
            state=$(gh pr view "$PR_URL" --json state,autoMergeRequest)
            pr_state=$(jq -r '.state' <<<"$state")
            armed=$(jq -r '.autoMergeRequest != null' <<<"$state")
            if [[ "$pr_state" == "MERGED" || "$pr_state" == "CLOSED" || "$armed" == "true" ]]; then
              echo "PR is ${pr_state}; auto-merge armed=${armed}."
              exit 0
            fi
            [[ "$attempt" -eq 6 ]] || sleep 2
          done

          echo "::error::The PR remains open without auto-merge. Confirm Allow auto-merge is enabled in the calling repository and the App installation has Contents and Pull requests write access."
          exit 1

  disarm-on-veto:
    if: >-
      github.event.action == 'labeled' && (github.event.label.name == 'trust-boundary' || github.event.label.name == 'security-review-required')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Shares the policy job's group so a veto label cancels an in-flight
    # policy run before it can approve or arm.
    concurrency:
      group: dependabot-policy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Minting is unconditional here: a veto hold must be enforced even
      # while the kill switch is off, and a run that cannot mint must fail
      # red rather than leave auto-merge armed.
      - name: Mint the automation-bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.automation-client-id }}
          private-key: ${{ secrets.automation-private-key }}

      # Fail closed: --disable-auto's exit code is not trusted — it errors
      # when there is nothing to disable and can report success without
      # taking effect. The re-query is the authoritative check, and an
      # unconfirmed disarm is a hard error.
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge --disable-auto "$PR_URL" 2>&1 || true
          # `--jq` renders a JSON null scalar as an empty string, so query a
          # boolean instead of comparing the raw value against "null". Only a
          # literal "false" passes; anything else fails closed.
          armed=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [[ "$armed" != "false" ]]; then
            echo "::error::Auto-merge is still enabled after applying a veto label. The PR may merge despite the hold; investigate immediately."
            exit 1
          fi
          echo "Auto-merge is disabled for the veto-label hold."
