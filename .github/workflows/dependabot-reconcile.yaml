name: Dependabot Reconcile

# Caller of this repository's own Dependabot reconciler — the bounded-latency
# sweep for dropped events, stalled auto-merge fires, and kill-switch flips.
# The contract lives in dependabot-reconciler.yaml's header.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Only the caller can serialize whole sweeps — a called workflow's jobs
# cannot hold a concurrency group past their own lifetime, and overlapping
# matrices would double the eviction pressure inside the per-PR groups.
concurrency:
  group: dependabot-reconciler
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    # Required verbatim by the callee: a called workflow can only downgrade
    # the caller's token, never raise it.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    # Local, for the reason the policy caller states — and here at none of
    # its cost: schedule resolves this against the default branch and
    # workflow_dispatch against a ref only write access can pick, so no pull
    # request's tree ever supplies the callee. Same footing as release.yaml's
    # local self-call.
    uses: ./.github/workflows/dependabot-reconciler.yaml
    with:
      automation-client-id: ${{ vars.AUTOMATION_CLIENT_ID }}
    secrets:
      automation-private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
