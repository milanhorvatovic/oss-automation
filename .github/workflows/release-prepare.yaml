name: Prepare Release

# Cuts the release commit so nobody hand-edits the two files that have to
# agree with the tag.
# release-tag.yaml refuses to publish unless the tag, the manifest version and
# a '## [X.Y.Z]' changelog section all match, and getting one of the three
# wrong is discovered at publish time, after the tag is already pushed.
#
# The changelog body comes from GitHub's own release-notes generator
# (POST /releases/generate-notes), the same content release-tag appends to the
# published release — so the section written here and the notes GitHub renders
# describe the same set of pull requests rather than two hand-kept lists that
# drift. Categories come from .github/release.yml when that file exists.
#
# Anything already written under '## [Unreleased]' is carried into the new
# section above the generated list rather than replaced. Prose explaining why a
# release matters is worth more than a pull-request inventory and no generator
# will produce it; the inventory is what nobody should have to type.
#
# Opens a pull request rather than pushing: the default branch's ruleset
# requires review and a green gate, and a release commit is not the one to
# exempt. The App token is not a preference here — a pull request opened with
# GITHUB_TOKEN never triggers the caller's other workflows, so its gate context
# would never report and the pull request could not merge.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 0.1.1).
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the automation-bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot-token.outputs.token }}
          # workflow_dispatch runs against whichever ref was picked in the UI,
          # and an omitted `ref` follows it. A release is cut from the default
          # branch or not at all, so name it rather than inherit the choice.
          ref: ${{ github.event.repository.default_branch }}
          # The generator needs the tag history to bound the previous release.
          fetch-depth: 0

      - name: Refuse a version that is not release-shaped
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Guarding the input rather than the tag: release-tag compares the
          # manifest against the tag minus its leading v as an exact string, so
          # a 'v' typed here would travel into pyproject.toml and fail there.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "::error::version '${VERSION}' is not a PEP 440 release version hatchling will accept in [project].version; pass it without a leading v (e.g. 0.1.1, 0.2.0rc1)."
            exit 1
          fi
          # The pattern above still admits spellings git refuses, and the
          # failure would otherwise surface at `git switch -c release/v...`
          # after the notes were already generated. git's own rules are the
          # authority on what a tag and a branch may be called.
          if ! git check-ref-format "refs/tags/v${VERSION}" || ! git check-ref-format "refs/heads/release/v${VERSION}"; then
            echo "::error::version '${VERSION}' does not spell a valid tag and branch name."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists; releasing it again would need the tag deleted first."
            exit 1
          fi
          # The tag is pushed by hand after the release pull request merges, so
          # between those two steps the check above passes for a version the
          # changelog already carries. Rewriting then appends a second section
          # and a second link for it.
          if grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md already carries a '## [${VERSION}]' section; that release is prepared, and only its tag is missing."
            exit 1
          fi
          # A closed-and-redispatched attempt leaves its head branch on the
          # remote, and the next run's branch is built on a newer base, so the
          # push would be refused as non-fast-forward. Refusing here says which
          # branch to delete instead of failing three steps later on a message
          # about fast-forwards; deleting it from the run would discard a
          # branch that might still hold an open pull request.
          if git ls-remote --exit-code --heads origin "release/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::branch release/v${VERSION} already exists on the remote; delete it (git push origin --delete release/v${VERSION}) or close its pull request and delete the branch, before dispatching again."
            exit 1
          fi

      - name: Generate the release notes for this range
        id: notes
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Reachability, not version sort. `--sort=-v:refname` orders suffixes
          # lexically unless versionsort.suffix is configured, so with both
          # v1.0.0 and v1.0.0rc1 present it can name the release candidate as
          # the latest, and it happily returns a higher-numbered tag from a
          # branch this commit does not contain. describe walks the ancestry
          # of the commit being released, which is the range the notes are
          # about. Empty output is the first release, where the generator
          # covers the whole history — what a first changelog wants.
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          # The commit this run actually prepared, not the branch name: the
          # default branch can advance between checkout and this call, and
          # github.sha names whichever ref the dispatch selected rather than
          # what was checked out. Both would make the boundary the pull
          # request reports a claim about a commit nobody prepared.
          base_sha=$(git rev-parse HEAD)
          echo "base-sha=${base_sha}" >> "$GITHUB_OUTPUT"
          args=(-f tag_name="v${VERSION}" -f target_commitish="$base_sha")
          if [[ -n "$previous" ]]; then
            args+=(-f previous_tag_name="$previous")
          fi
          gh api -X POST "repos/${GH_REPO}/releases/generate-notes" "${args[@]}" --jq '.body' > "${RUNNER_TEMP}/generated-notes.md"
          printf 'release-date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Through the sub-action rather than the script directly, so the surface
      # a consumer calls is the one this repository's own release exercises.
      - name: Promote the Unreleased section
        uses: ./changelog-section
        with:
          version: ${{ inputs.version }}
          date: ${{ steps.notes.outputs.release-date }}
          notes: ${{ runner.temp }}/generated-notes.md

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          APP_SLUG: ${{ steps.bot-token.outputs.app-slug }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ steps.notes.outputs.base-sha }}
        run: |
          set -euo pipefail
          branch="release/v${VERSION}"
          git switch -c "$branch"
          git config user.name "${APP_SLUG}[bot]"
          # The App's noreply address, so the commit attributes to the App
          # rather than to whoever dispatched the workflow.
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml
          git commit -m "Release v${VERSION}"
          git push origin "$branch"
          # Heredoc at the block scalar's own indentation: YAML strips those
          # ten columns before bash sees the script, so the fence below lands
          # at column zero in the pull-request body.
          cat > "${RUNNER_TEMP}/release-pr-body.md" <<EOF
          Prepared by \`release-prepare.yaml\`. The changelog section is GitHub's generated release notes for this range; anything written under Unreleased was carried across above it.

          The section covers the default branch at \`${BASE_SHA}\`. Anything merged after that lands in the tag but in no notes, so if the default branch has moved on when you come back to this, close this pull request, delete its \`release/v${VERSION}\` branch, and dispatch again rather than merging it stale.

          Review the section, then merge and tag that merge commit — not whatever the default branch has advanced to:

          \`\`\`
          git switch ${DEFAULT_BRANCH} && git pull
          MERGE_SHA=...   # the merge commit of this pull request
          git tag -s v${VERSION} "\$MERGE_SHA"
          git push origin v${VERSION}
          \`\`\`

          \`release-tag.yaml\` verifies that the tag, the manifest version and this section agree before it publishes.
          EOF
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "$branch" \
            --title "Release v${VERSION}" \
            --body-file "${RUNNER_TEMP}/release-pr-body.md"
