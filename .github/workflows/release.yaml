name: Release

# This repository's own release flow: tag-driven, calling the local reusable
# release-tag workflow after the full suite passes on the tagged commit. The
# release-please flavor is deliberately not used here — this repository's
# commit convention is not Conventional Commits; it is offered to consumers
# as a reusable workflow instead.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The same floor-and-current pair test.yaml covers. A tag can point at
        # any commit, including one that never went through that workflow, so
        # this gate cannot lean on it having already run.
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the test-pack
        run: python -m pip install '.[dev]'
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Run the unit tests
        run: pytest
      - name: Run the guards against this repository's workflow tree
        run: pytest --pyargs oss_automation_guards

  release:
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/release-tag.yaml
    with:
      # python3, not python: this command runs in the callee's job, which
      # checks out but never sets up Python, so it gets the runner image's
      # interpreter — and only python3 is guaranteed to be a name for it.
      version-command: >-
        python3 -c 'import tomllib;
        print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
