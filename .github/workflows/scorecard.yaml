name: Scorecard

# OpenSSF Scorecard, run against this repository and published to the public
# Scorecard dataset so the README badge has something to read.
#
# Publishing is the point rather than a side effect: the score is only
# checkable by a consumer deciding whether to call these workflows if it is
# public. Everything it publishes — pinning, permissions, branch protection,
# maintenance cadence — is already visible in this repository.
#
# No branch_protection_rule trigger, though the upstream template carries one:
# this repository's default branch is governed by a ruleset, and ruleset edits
# do not raise that event. The weekly schedule is what refreshes the score
# after a settings change here.

on:
  schedule:
    - cron: "27 3 * * 1"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Uploads the SARIF into the repository's code-scanning alerts.
      security-events: write
      # Mints the OIDC token the publish step signs its submission with; no
      # standing credential is involved.
      id-token: write
      # Read-only checks that walk the workflow tree and the run history.
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
