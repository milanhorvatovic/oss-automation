name: Secret Store Canary

# Temporary probe, and the only end-to-end check available before the App
# credentials exist. dependabot-automerge.yaml maps Actions secrets into a
# pull_request_target run, on the strength of two sources:
#
#   https://github.blog/changelog/2021-02-19-github-actions-workflows-triggered-by-dependabot-prs-will-run-with-read-only-permissions/
#     — the change itself, whose restricted-event list is pull_request,
#       pull_request_review, pull_request_review_comment and push, and
#       does not include pull_request_target.
#   https://github.com/dependabot/dependabot-core/issues/3253#issuecomment-852541544
#     — the maintainer FAQ published with it, which recommends this exact
#       trigger and annotates its example "this workflow has secrets and a
#       read-write token".
#
# Against them, GitHub's own troubleshooting page disagrees with itself:
#
#   https://docs.github.com/en/code-security/reference/supply-chain-security/troubleshoot-dependabot/dependabot-on-actions
#     — prose naming a pull request whose base ref was created by
#       Dependabot as the exception.
#   https://docs.github.com/en/enterprise-server@3.11/code-security/dependabot/troubleshooting-dependabot/troubleshooting-dependabot-on-github-actions
#     — the same exception written as
#       github.event.pull_request.user.login == 'dependabot[bot]', which is
#       every Dependabot pull request and would mean no secrets here at all.
#
# The parenthetical was judged a documentation error. This workflow settles
# which reading holds for this repository, on a throwaway secret, before a
# real credential depends on the answer.
#
# To use it: set SECRET_STORE_CANARY to any throwaway string in the Actions
# secret store, then wait for Dependabot's next pull request — weekly by
# schedule, or sooner by touching .github/dependabot.yaml, which triggers a
# check. Read the result in the run's annotations.
#
# Delete this file once it has reported. It answers one question once, and
# a probe left running is a workflow nobody rereads holding a secret
# nobody remembers setting.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

jobs:
  canary:
    # The trust guards dependabot-policy.yaml's header requires of any
    # credentialed pull_request_target job, for the same reason: this one
    # reads a secret, so it runs only for Dependabot's own pull requests
    # from this repository. No default-branch conjunct — unlike the policy caller
    # this job delegates to nothing, and a non-default target's result is
    # itself data worth having, which the base ref below records.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report whether an Actions secret reached this run
        env:
          CANARY: ${{ secrets.SECRET_STORE_CANARY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Presence, and nothing else. The value is never printed, never
          # compared against an expected string, never written anywhere:
          # whether it arrived is the entire question, and a canary that
          # leaked what it checks would cost more than the uncertainty it
          # settles.
          if [[ -n "$CANARY" ]]; then
            echo "::notice::An Actions secret reached this Dependabot pull_request_target run (base ${BASE_REF}, default branch ${DEFAULT_BRANCH}). The policy caller's credential mapping resolves on this path; delete this workflow."
          else
            echo "::warning::No Actions secret reached this Dependabot pull_request_target run (base ${BASE_REF}, default branch ${DEFAULT_BRANCH}). Either SECRET_STORE_CANARY is unset, or this path does not carry Actions secrets — in which case dependabot-automerge.yaml would arrive uncredentialed and dependabot-policy.yaml's 'Fail on missing credentials with the switch on' step would fail the run."
          fi
