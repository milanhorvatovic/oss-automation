name: Test

on:
  pull_request:
  push:
    branches:
      - main

# Pull requests group by ref, so a new push supersedes the run in flight:
# only the head that merges needs a result. Pushes group by commit, so they
# never contend at all. Sharing one group across default-branch pushes would
# not queue them — a group holds one running and one pending run, and a third
# arrival evicts the pending one, leaving that commit with no result rather
# than a superseded one.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yaml
