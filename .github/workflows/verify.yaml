name: Verify

# The one definition of "this repository passes", called by the pull-request
# gate and by the release gate alike.
#
# Kept as a reusable workflow rather than a composite action for two reasons.
# A composite action can only hold the command steps — the matrix, the
# checkout and the interpreter setup would stay duplicated in both callers,
# which is most of what there was to share. And `.github/actions` is outside
# the tree discover_workflows() walks, so every pin and permission moved there
# would leave the guards' sight; this repository grades its own workflow tree,
# and shrinking that tree to tidy a file is the wrong trade.
#
# No ref input: a called workflow runs in the caller's context, so a plain
# checkout resolves the pull request's merge commit under test.yaml and the
# pushed tag under release.yaml without either caller saying so.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported floor and the current release.
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here touches git, so the default persisted credential
          # would only sit in .git/config for the suite to read.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the test-pack
        run: python -m pip install '.[dev]'
      - name: Lint
        run: |
          ruff check src tests .github/scripts
          ruff format --check src tests .github/scripts
      # Scoped to src by [tool.mypy]: py.typed ships inside the wheel, so the
      # annotations a consumer's type checker reads are the ones under check
      # here.
      - name: Type-check
        run: mypy
      # Coverage spans both suites, so the threshold is judged once, after
      # the second: the guards exercise paths the unit tests never reach and
      # the reverse, and a floor applied to either half alone would fail a
      # change whose combined coverage is fine.
      - name: Run the unit tests
        run: pytest --cov --cov-report= --cov-fail-under=0
      - name: Run the guards against this repository's workflow tree
        run: pytest --pyargs oss_automation_guards --cov --cov-append
      # The sdist ships the suite, and the suite reads a file outside src/, so
      # pyproject's include list is load-bearing and nothing else notices when
      # it stops covering what the tests open: the wheel is unaffected and a
      # broken sdist surfaces only when someone unpacks a published release.
      # The install into a fresh environment is what makes this a check on the
      # artifact — run against the environment built from the checkout, the
      # tests import the package that was installed there, and dropping /src
      # from the include list would leave this green. Coverage is already gated
      # above; this pass deliberately does not append to it.
      - name: Run the shipped suite from an sdist
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r requirements-release.txt
          python -m build --no-isolation --sdist --outdir "${RUNNER_TEMP}/sdist" .
          tar xzf "${RUNNER_TEMP}"/sdist/*.tar.gz -C "${RUNNER_TEMP}/sdist"
          python -m venv "${RUNNER_TEMP}/sdist-env"
          cd "${RUNNER_TEMP}/sdist"/oss_automation_guards-*/
          "${RUNNER_TEMP}/sdist-env/bin/pip" install --disable-pip-version-check --quiet .
          "${RUNNER_TEMP}/sdist-env/bin/pytest" -q
