[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-automation-guards"
version = "0.1.0"
description = "Structural pytest guards a repository runs against its own GitHub Actions workflow tree."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Milan Horvatovič" }]
keywords = ["github-actions", "workflows", "pytest", "supply-chain-security"]
# No `License ::` classifier: PEP 639 makes the license expression above the
# single source, and a build carrying both is rejected.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pytest>=8",
  "PyYAML>=6",
]

# Exact pins so CI is reproducible and Dependabot's pip updates bump them;
# the runtime dependencies above stay ranges because this is a library.
[project.optional-dependencies]
# What checks the code. What builds a release artifact lives in
# requirements-release.txt instead, hash-locked: an extra cannot pin a
# transitive closure, and that tooling produces bytes a release attests.
dev = [
  "mypy==2.3.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
  "types-PyYAML==6.0.12.20260815",
]

[project.urls]
Homepage = "https://github.com/milanhorvatovic/oss-automation"
Changelog = "https://github.com/milanhorvatovic/oss-automation/blob/main/CHANGELOG.md"
Issues = "https://github.com/milanhorvatovic/oss-automation/issues"

[project.entry-points.pytest11]
oss_automation_guards = "oss_automation_guards.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_automation_guards"]

# Named rather than inferred. Hatchling's default sdist mirrors the working
# tree minus .gitignore, so a file ignored only by .git/info/exclude — a
# per-clone list no other machine carries — travels into a published artifact,
# and what the sdist holds depends on whose checkout built it.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  # tests/test_changelog_section.py loads this script by path at import time,
  # so an sdist carrying the suite without it collects zero tests and one
  # FileNotFoundError.
  "/.github/scripts",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Measured by import name, not by path: CI installs the wheel rather than the
# source tree, so the guards run from site-packages and a path source would
# report every line of them missing.
[tool.coverage.run]
source = ["oss_automation_guards"]
branch = true

[tool.coverage.report]
show_missing = true
# Under the low nineties the two suites reach together, with room for a
# change that lands slightly behind its tests rather than a ratchet failing
# the pull request that adds a guard before the one that exercises it.
fail_under = 90

# The package ships py.typed, so its annotations are a promise to a consumer's
# type checker. Strict is what makes that promise checked rather than nominal.
[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
